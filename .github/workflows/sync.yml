name: Sync Klipper Ecosystem

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  # 这是你原来那 18 个普通仓库的同步
  sync-others:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: "Klipper3d/klipper.git"
            gitee: "klipper"
          - repo: "Arksine/moonraker.git"
            gitee: "moonraker"
          - repo: "KlipperScreen/KlipperScreen.git"
            gitee: "KlipperScreen"
          - repo: "julianschill/klipper-led_effect.git"
            gitee: "klipper-led_effect"
          - repo: "mainsail-crew/moonraker-timelapse.git"
            gitee: "moonraker-timelapse"
          - repo: "ArmoredTurtle/AFC-Klipper-Add-On.git"
            gitee: "AFC-Klipper-Add-On"
          - repo: "ArmoredTurtle/AFC-Klipper-Screen-Add-On.git"
            gitee: "AFC-Klipper-Screen-Add-On"
          - repo: "mainsail-crew/crowsnest.git"
            gitee: "crowsnest"
          - repo: "Donkie/Spoolman.git"
            gitee: "Spoolman"
          - repo: "fluidd-core/fluidd.git"
            gitee: "fluidd"
          - repo: "fluidd-core/fluidd-config.git"
            gitee: "fluidd-config"
          - repo: "mainsail-crew/mainsail.git"
            gitee: "mainsail"
          - repo: "mainsail-crew/mainsail-config.git"
            gitee: "mainsail-config"
          - repo: "Arksine/katapult.git"
            gitee: "katapult"
          - repo: "Clon1998/mobileraker_companion.git"
            gitee: "mobileraker_companion"
          - repo: "nlef/moonraker-telegram-bot.git"
            gitee: "moonraker-telegram-bot"
          - repo: "andrewmcgr/klipper_tmc_autotune.git"
            gitee: "klipper_tmc_autotune"
          - repo: "kyleisah/Klipper-Adaptive-Meshing-Purging.git"
            gitee: "Klipper-Adaptive-Meshing-Purging"
    steps:
      - name: Sync ${{ matrix.repo }} to Gitee
        run: |
          echo "Syncing ${{ matrix.repo }} ..."
          git clone https://github.com/${{ matrix.repo }} repo_temp
          cd repo_temp
          git remote set-url origin https://ydd632184193:${{ secrets.GITEE_TOKEN }}@gitee.com/ydd632184193/${{ matrix.gitee }}.git
          git push -f origin HEAD:master

  # 🚨 这是专门为 KIAUH 写的“自动化打补丁”任务
  sync-kiauh-patched:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Upstream KIAUH
        run: |
          git clone https://github.com/dw-0/kiauh.git kiauh-patched
          
      - name: Apply Gitee Mirrors Patch (自动替换源)
        run: |
          cd kiauh-patched
          # 1. 核心组件
          sed -i 's|https://github.com/Klipper3d/klipper.git|https://gitee.com/ydd632184193/klipper.git|g' kiauh/components/klipper/__init__.py
          sed -i 's|https://github.com/Arksine/moonraker.git|https://gitee.com/ydd632184193/moonraker.git|g' kiauh/components/moonraker/__init__.py
          sed -i 's|https://github.com/KlipperScreen/KlipperScreen.git|https://gitee.com/ydd632184193/KlipperScreen.git|g' kiauh/components/klipperscreen/__init__.py
          sed -i 's|https://github.com/mainsail-crew/crowsnest.git|https://gitee.com/ydd632184193/crowsnest.git|g' kiauh/components/crowsnest/__init__.py
          sed -i 's|https://github.com/mainsail-crew/mainsail-config.git|https://gitee.com/ydd632184193/mainsail-config.git|g' kiauh/components/webui_client/mainsail_data.py
          sed -i 's|https://github.com/fluidd-core/fluidd-config.git|https://gitee.com/ydd632184193/fluidd-config.git|g' kiauh/components/webui_client/fluidd_data.py
          
          # 2. 前端 zip 劫持
          sed -i 's|https://api.github.com/repos/mainsail-crew/mainsail/releases/latest|https://gitee.com/ydd632184193/mainsail_zip/raw/master/mainsail.zip|g' kiauh/components/webui_client/mainsail.py
          sed -i 's|https://github.com/mainsail-crew/mainsail/releases/download/.*/mainsail.zip|https://gitee.com/ydd632184193/mainsail_zip/raw/master/mainsail.zip|g' kiauh/components/webui_client/mainsail.py

          # 3. 扩展菜单
          sed -i 's|https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging|https://gitee.com/ydd632184193/Klipper-Adaptive-Meshing-Purging|g' kiauh/extensions/klipper_adaptive_meshing_purging/__init__.py
          sed -i 's|https://github.com/andrewmcgr/klipper_tmc_autotune|https://gitee.com/ydd632184193/klipper_tmc_autotune|g' kiauh/extensions/tmc_autotune/__init__.py
          sed -i 's|https://github.com/Donkie/Spoolman|https://gitee.com/ydd632184193/Spoolman|g' kiauh/extensions/spoolman/__init__.py
          sed -i 's|https://github.com/Clon1998/mobileraker_companion.git|https://gitee.com/ydd632184193/mobileraker_companion.git|g' kiauh/extensions/mobileraker/__init__.py
          sed -i 's|https://github.com/nlef/moonraker-telegram-bot.git|https://gitee.com/ydd632184193/moonraker-telegram-bot.git|g' kiauh/extensions/telegram_bot/__init__.py
          sed -i 's|https://github.com/mainsail-crew/moonraker-timelapse|https://gitee.com/ydd632184193/moonraker-timelapse|g' kiauh/extensions/timelapse/__init__.py
          sed -i 's|https://github.com/TheSpaghettiDetective/moonraker-obico.git|https://gitee.com/ydd632184193/moonraker-obico.git|g' kiauh/extensions/obico/__init__.py
          sed -i 's|https://github.com/QuinnDamerell/OctoPrint-OctoEverywhere.git|https://gitee.com/ydd632184193/OctoPrint-OctoEverywhere.git|g' kiauh/extensions/octoeverywhere/__init__.py

          # 4. 配置文件
          sed -i 's|https://github.com/Klipper3d/klipper|https://gitee.com/ydd632184193/klipper.git|g' default.kiauh.cfg
          sed -i 's|https://github.com/Arksine/moonraker|https://gitee.com/ydd632184193/moonraker.git|g' default.kiauh.cfg
          
      - name: Commit and Push to Gitee
        run: |
          cd kiauh-patched
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # 强制把修改后的代码推送到你 Gitee 的 kiauh 仓库
          git remote set-url origin https://ydd632184193:${{ secrets.GITEE_TOKEN }}@gitee.com/ydd632184193/kiauh.git
          git push -f origin HEAD:master
