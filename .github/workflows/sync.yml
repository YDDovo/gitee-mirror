name: Sync Klipper Ecosystem

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync-others:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: "Klipper3d/klipper.git"
            gitee: "klipper"
          - repo: "Arksine/moonraker.git"
            gitee: "moonraker"
          - repo: "KlipperScreen/KlipperScreen.git"
            gitee: "KlipperScreen"
          - repo: "julianschill/klipper-led_effect.git"
            gitee: "klipper-led_effect"
          - repo: "mainsail-crew/moonraker-timelapse.git"
            gitee: "moonraker-timelapse"
          - repo: "ArmoredTurtle/AFC-Klipper-Add-On.git"
            gitee: "AFC-Klipper-Add-On"
          - repo: "ArmoredTurtle/AFC-Klipper-Screen-Add-On.git"
            gitee: "AFC-Klipper-Screen-Add-On"
          - repo: "mainsail-crew/crowsnest.git"
            gitee: "crowsnest"
          - repo: "Donkie/Spoolman.git"
            gitee: "Spoolman"
          - repo: "fluidd-core/fluidd.git"
            gitee: "fluidd"
          - repo: "fluidd-core/fluidd-config.git"
            gitee: "fluidd-config"
          - repo: "mainsail-crew/mainsail.git"
            gitee: "mainsail"
          - repo: "mainsail-crew/mainsail-config.git"
            gitee: "mainsail-config"
          - repo: "Arksine/katapult.git"
            gitee: "katapult"
          - repo: "Clon1998/mobileraker_companion.git"
            gitee: "mobileraker_companion"
          - repo: "nlef/moonraker-telegram-bot.git"
            gitee: "moonraker-telegram-bot"
          - repo: "andrewmcgr/klipper_tmc_autotune.git"
            gitee: "klipper_tmc_autotune"
          - repo: "kyleisah/Klipper-Adaptive-Meshing-Purging.git"
            gitee: "Klipper-Adaptive-Meshing-Purging"
    steps:
      - name: Sync ${{ matrix.repo }} to Gitee
        run: |
          echo "Syncing ${{ matrix.repo }} ..."
          git clone https://github.com/${{ matrix.repo }} repo_temp
          cd repo_temp
          git remote set-url origin https://ydd632184193:${{ secrets.GITEE_TOKEN }}@gitee.com/ydd632184193/${{ matrix.gitee }}.git
          git config --global http.version HTTP/1.1
          for i in 1 2 3; do git push -f origin HEAD:master && break || sleep 5; done

  sync-kiauh-patched:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Upstream KIAUH
        run: |
          git clone https://github.com/dw-0/kiauh.git kiauh-patched
          
      - name: Apply Gitee Mirrors Patch & Inject Timelapse
        run: |
          cd kiauh-patched
          
          # 1. 基础替换
          FILES=$(grep -rl "https://github.com" . --include="*.py" --include="*.cfg" --include="*.sh" || true)
          if [ -n "$FILES" ]; then
            sed -i \
              -e 's|https://github.com/Klipper3d/klipper.git|https://gitee.com/ydd632184193/klipper.git|g' \
              -e 's|https://github.com/Arksine/moonraker.git|https://gitee.com/ydd632184193/moonraker.git|g' \
              -e 's|https://github.com/KlipperScreen/KlipperScreen.git|https://gitee.com/ydd632184193/KlipperScreen.git|g' \
              -e 's|https://github.com/mainsail-crew/crowsnest.git|https://gitee.com/ydd632184193/crowsnest.git|g' \
              -e 's|https://github.com/mainsail-crew/mainsail-config.git|https://gitee.com/ydd632184193/mainsail-config.git|g' \
              -e 's|https://github.com/fluidd-core/fluidd-config.git|https://gitee.com/ydd632184193/fluidd-config.git|g' \
              -e 's|https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging|https://gitee.com/ydd632184193/Klipper-Adaptive-Meshing-Purging|g' \
              -e 's|https://github.com/andrewmcgr/klipper_tmc_autotune|https://gitee.com/ydd632184193/klipper_tmc_autotune|g' \
              -e 's|https://github.com/Donkie/Spoolman|https://gitee.com/ydd632184193/Spoolman|g' \
              -e 's|https://github.com/Clon1998/mobileraker_companion|https://gitee.com/ydd632184193/mobileraker_companion|g' \
              -e 's|https://github.com/nlef/moonraker-telegram-bot|https://gitee.com/ydd632184193/moonraker-telegram-bot|g' \
              -e 's|https://github.com/mainsail-crew/moonraker-timelapse|https://gitee.com/ydd632184193/moonraker-timelapse|g' \
              -e 's|https://github.com/TheSpaghettiDetective/moonraker-obico|https://gitee.com/ydd632184193/moonraker-obico|g' \
              -e 's|https://github.com/QuinnDamerell/OctoPrint-OctoEverywhere|https://gitee.com/ydd632184193/OctoPrint-OctoEverywhere|g' \
              $FILES
          fi

          # 2. 修正 Mainsail 下载
          sed -i -E 's|BASE_DL_URL: str = ".*"|BASE_DL_URL: str = "https://gitee.com/ydd632184193/mainsail_zip/raw/master/"|g' kiauh/components/webui_client/mainsail_data.py || true
          sed -i 's|/latest/download/|/|g' kiauh/components/webui_client/client_utils.py || true

          # 3. 用 Base64 安全注入 Python 脚本 (不怕任何缩进破坏)
          echo "" | base64 -d > patch.py
          python3 patch.py
          rm patch.py
          
          # 4. 清理缓存
          find . -type d -name "__pycache__" -exec rm -rf {} + || true
          
      - name: Commit and Push to Gitee
        run: |
          cd kiauh-patched
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto patch: Gitee mirrors, Mainsail URL fix, & Timelapse injection" || echo "Nothing to commit"
          git remote set-url origin https://ydd632184193:${{ secrets.GITEE_TOKEN }}@gitee.com/ydd632184193/kiauh.git
          git config --global http.version HTTP/1.1
          for i in 1 2 3; do git push -f origin HEAD:master && break || sleep 5; done
