name: Sync Klipper Ecosystem

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync-others:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: "Klipper3d/klipper.git"
            gitee: "klipper"
          - repo: "Arksine/moonraker.git"
            gitee: "moonraker"
          - repo: "KlipperScreen/KlipperScreen.git"
            gitee: "KlipperScreen"
          - repo: "julianschill/klipper-led_effect.git"
            gitee: "klipper-led_effect"
          - repo: "mainsail-crew/moonraker-timelapse.git"
            gitee: "moonraker-timelapse"
          - repo: "ArmoredTurtle/AFC-Klipper-Add-On.git"
            gitee: "AFC-Klipper-Add-On"
          - repo: "ArmoredTurtle/AFC-Klipper-Screen-Add-On.git"
            gitee: "AFC-Klipper-Screen-Add-On"
          - repo: "mainsail-crew/crowsnest.git"
            gitee: "crowsnest"
          - repo: "Donkie/Spoolman.git"
            gitee: "Spoolman"
          - repo: "fluidd-core/fluidd.git"
            gitee: "fluidd"
          - repo: "fluidd-core/fluidd-config.git"
            gitee: "fluidd-config"
          - repo: "mainsail-crew/mainsail.git"
            gitee: "mainsail"
          - repo: "mainsail-crew/mainsail-config.git"
            gitee: "mainsail-config"
          - repo: "Arksine/katapult.git"
            gitee: "katapult"
          - repo: "Clon1998/mobileraker_companion.git"
            gitee: "mobileraker_companion"
          - repo: "nlef/moonraker-telegram-bot.git"
            gitee: "moonraker-telegram-bot"
          - repo: "andrewmcgr/klipper_tmc_autotune.git"
            gitee: "klipper_tmc_autotune"
          - repo: "kyleisah/Klipper-Adaptive-Meshing-Purging.git"
            gitee: "Klipper-Adaptive-Meshing-Purging"
          - repo: "TheSpaghettiDetective/moonraker-obico.git"
            gitee: "moonraker-obico"
          - repo: "QuinnDamerell/OctoPrint-OctoEverywhere.git"
            gitee: "OctoPrint-OctoEverywhere"
    steps:
      - name: Sync ${{ matrix.repo }} to Gitee
        run: |
          set -euo pipefail
          echo "Syncing ${{ matrix.repo }} ..."
          git clone --mirror https://github.com/${{ matrix.repo }} repo_temp
          cd repo_temp
          git remote set-url origin https://ydd632184193:${{ secrets.GITEE_TOKEN }}@gitee.com/ydd632184193/${{ matrix.gitee }}.git
          git config --global http.version HTTP/1.1
          
          # 关键修复：解除 --mirror 留下的标记，否则后面带 refspec 的 push 会报错
          git config --unset remote.origin.mirror || true
          
          ok=0
          for i in 1 2 3; do
            if git push -f origin "refs/heads/*:refs/heads/*" "refs/tags/*:refs/tags/*"; then 
              ok=1
              break
            fi
            echo "Push failed, retrying ($i/3)..."
            sleep 5
          done
          if [ $ok -ne 1 ]; then echo "❌ Failed to push ${{ matrix.repo }}"; exit 1; fi

  sync-kiauh-patched:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Upstream KIAUH
        run: |
          git clone https://github.com/dw-0/kiauh.git kiauh-patched
          
      - name: Apply Gitee Mirrors Patch & Inject Timelapse
        run: |
          set -euo pipefail
          cd kiauh-patched
          
          cat << 'PYEOF' > patch_urls.py
          import os, re

          mapping = {
              "klipper3d/klipper": "klipper",
              "arksine/moonraker": "moonraker",
              "klipperscreen/klipperscreen": "KlipperScreen",
              "mainsail-crew/crowsnest": "crowsnest",
              "mainsail-crew/mainsail-config": "mainsail-config",
              "fluidd-core/fluidd-config": "fluidd-config",
              "kyleisah/klipper-adaptive-meshing-purging": "Klipper-Adaptive-Meshing-Purging",
              "andrewmcgr/klipper_tmc_autotune": "klipper_tmc_autotune",
              "donkie/spoolman": "Spoolman",
              "clon1998/mobileraker_companion": "mobileraker_companion",
              "nlef/moonraker-telegram-bot": "moonraker-telegram-bot",
              "mainsail-crew/moonraker-timelapse": "moonraker-timelapse",
              "thespaghettidetective/moonraker-obico": "moonraker-obico",
              "quinn-damerell/octoprint-octoeverywhere": "OctoPrint-OctoEverywhere",
              "quinn-damerell/octoeverywhere": "OctoPrint-OctoEverywhere",
          }

          def repl(m):
              repo = m.group(1).lower()
              if repo.endswith(".git"):
                  repo = repo[:-4]
              if repo in mapping:
                  return f"https://gitee.com/ydd632184193/{mapping[repo]}.git"
              return m.group(0)

          for root, dirs, files in os.walk("."):
              if ".git" in root: continue
              for f in files:
                  if f.endswith((".py", ".cfg", ".sh", ".txt")):
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8", errors="ignore") as file:
                          content = file.read()
                      
                      # 关键修复：把 (?=[\"'\s]|$) 改为 (?=[^a-zA-Z0-9_.\-/]|$)，兼容逗号、分号等符号
                      new_content = re.sub(r"https://github\.com/([a-zA-Z0-9_.\-]+/[a-zA-Z0-9_.\-]+?)(?:\.git)?(?=[^a-zA-Z0-9_.\-/]|$)", repl, content, flags=re.IGNORECASE)
                      
                      if new_content != content:
                          with open(p, "w", encoding="utf-8") as file:
                              file.write(new_content)
          print("✅ GitHub 到 Gitee 的 URL 替换已完成！")
          PYEOF
          
          python3 patch_urls.py
          rm patch_urls.py

          # 修正 Mainsail 和 Fluidd 的 Zip 包下载地址
          if [ -f kiauh/components/webui_client/mainsail_data.py ]; then
            sed -i -E 's|BASE_DL_URL: str = ".*"|BASE_DL_URL: str = "https://gitee.com/ydd632184193/mainsail_zip/raw/master/"|g' kiauh/components/webui_client/mainsail_data.py
          fi
          if [ -f kiauh/components/webui_client/fluidd_data.py ]; then
            sed -i -E 's|BASE_DL_URL: str = ".*"|BASE_DL_URL: str = "https://gitee.com/ydd632184193/fluidd_zip/raw/master/"|g' kiauh/components/webui_client/fluidd_data.py
          fi
          if [ -f kiauh/components/webui_client/client_utils.py ]; then
            sed -i 's|/latest/download/|/|g' kiauh/components/webui_client/client_utils.py
          fi

          # 注入延时摄影
          cat << 'PYEOF' > patch_menu.py
          import os
          file_path = 'kiauh/core/menus/install_menu.py'
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()

          if '"9": Option' not in content:
              content = content.replace('"8": Option(method=self.install_crowsnest),', '"8": Option(method=self.install_crowsnest),\n            "9": Option(method=self.install_timelapse),')
              content = content.replace('║  3) [Mainsail]            │                           ║', '║  3) [Mainsail]            │  9) [Timelapse]           ║')

          if 'def install_timelapse' not in content:
              method = (
                  '    def install_timelapse(self, **kwargs) -> None:\n'
                  '        import os\n'
                  '        print("\\n[INFO] 正在从你的 Gitee 仓库安装 Moonraker-Timelapse...")\n'
                  '        tl_dir = os.path.expanduser("~/moonraker-timelapse")\n'
                  '        if not os.path.exists(tl_dir):\n'
                  '            os.system("git clone https://gitee.com/ydd632184193/moonraker-timelapse.git ~/moonraker-timelapse")\n'
                  '        print("[INFO] 正在执行官方安装脚本 (make install)...")\n'
                  '        os.system("cd ~/moonraker-timelapse && make install")\n'
                  '        print("[INFO] 正在检查依赖和配置文件...")\n'
                  '        os.system("sudo apt install ffmpeg -y")\n'
                  '        config_dir = os.path.expanduser("~/printer_data/config")\n'
                  '        # 1. 处理 moonraker.conf\n'
                  '        mrk_conf = os.path.join(config_dir, "moonraker.conf")\n'
                  '        if os.path.exists(mrk_conf):\n'
                  '            with open(mrk_conf, "r") as f:\n'
                  '                if "[timelapse]" not in f.read():\n'
                  '                    with open(mrk_conf, "a") as f_append:\n'
                  '                        f_append.write("\\n[timelapse]\\n")\n'
                  '        # 2. 处理 printer.cfg\n'
                  '        prn_conf = os.path.join(config_dir, "printer.cfg")\n'
                  '        if os.path.exists(prn_conf):\n'
                  '            with open(prn_conf, "r") as f:\n'
                  '                if "timelapse.cfg" not in f.read():\n'
                  '                    with open(prn_conf, "a") as f_append:\n'
                  '                        f_append.write("\\n[include timelapse.cfg]\\n")\n'
                  '        os.system("sudo systemctl restart moonraker")\n'
                  '        print("\\n[OK] Timelapse 安装并配置完美成功！按回车返回菜单...")\n'
                  '        input()\n'
                  '\n'
                  '    def install_crowsnest(self, **kwargs) -> None:\n'
              )
              content = content.replace('    def install_crowsnest(self, **kwargs) -> None:\n', method)

          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print("✅ 延时摄影注入完成！")
          PYEOF
          
          python3 patch_menu.py
          rm patch_menu.py

          if grep -rn "Klipper3D/klipper\|Klipper3d/klipper" kiauh/ --include="*.py" | grep -v gitee; then
            echo "❌ 警告：仍有 Klipper 的 GitHub URL 残留！"
            exit 1
          fi
          python3 -m py_compile $(find kiauh -name "*.py") || { echo "❌ Python 语法校验失败"; exit 1; }
          find . -type d -name "__pycache__" -exec rm -rf {} + || true

      - name: Commit and Push to Gitee
        run: |
          set -euo pipefail
          cd kiauh-patched
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto patch: Gitee mirrors, Mainsail URL fix, & Timelapse injection" || echo "Nothing to commit"
          git remote set-url origin https://ydd632184193:${{ secrets.GITEE_TOKEN }}@gitee.com/ydd632184193/kiauh.git
          git config --global http.version HTTP/1.1
          
          ok=0
          for i in 1 2 3; do
            if git push -f origin HEAD:master; then ok=1; break; fi
            echo "Push failed, retrying ($i/3)..."
            sleep 5
          done
          if [ $ok -ne 1 ]; then echo "❌ Failed to push KIAUH"; exit 1; fi
