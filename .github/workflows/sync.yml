  sync-kiauh-patched:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Upstream KIAUH
        run: |
          git clone https://github.com/dw-0/kiauh.git kiauh-patched
          
      - name: Apply Gitee Mirrors Patch & Inject Timelapse
        run: |
          cd kiauh-patched
          
          # 1. 基础替换（完美去掉 .git，一网打尽）
          FILES=$(grep -rl "https://github.com" . --include="*.py" --include="*.cfg" --include="*.sh" || true)
          if [ -n "$FILES" ]; then
            sed -i \
              -e 's|https://github.com/Klipper3d/klipper|https://gitee.com/ydd632184193/klipper|g' \
              -e 's|https://github.com/Arksine/moonraker|https://gitee.com/ydd632184193/moonraker|g' \
              -e 's|https://github.com/KlipperScreen/KlipperScreen|https://gitee.com/ydd632184193/KlipperScreen|g' \
              -e 's|https://github.com/mainsail-crew/crowsnest|https://gitee.com/ydd632184193/crowsnest|g' \
              -e 's|https://github.com/mainsail-crew/mainsail-config|https://gitee.com/ydd632184193/mainsail-config|g' \
              -e 's|https://github.com/fluidd-core/fluidd-config|https://gitee.com/ydd632184193/fluidd-config|g' \
              -e 's|https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging|https://gitee.com/ydd632184193/Klipper-Adaptive-Meshing-Purging|g' \
              -e 's|https://github.com/andrewmcgr/klipper_tmc_autotune|https://gitee.com/ydd632184193/klipper_tmc_autotune|g' \
              -e 's|https://github.com/Donkie/Spoolman|https://gitee.com/ydd632184193/Spoolman|g' \
              -e 's|https://github.com/Clon1998/mobileraker_companion|https://gitee.com/ydd632184193/mobileraker_companion|g' \
              -e 's|https://github.com/nlef/moonraker-telegram-bot|https://gitee.com/ydd632184193/moonraker-telegram-bot|g' \
              -e 's|https://github.com/mainsail-crew/moonraker-timelapse|https://gitee.com/ydd632184193/moonraker-timelapse|g' \
              -e 's|https://github.com/TheSpaghettiDetective/moonraker-obico|https://gitee.com/ydd632184193/moonraker-obico|g' \
              -e 's|https://github.com/QuinnDamerell/OctoPrint-OctoEverywhere|https://gitee.com/ydd632184193/OctoPrint-OctoEverywhere|g' \
              $FILES
          fi

          # 2. 修正 Mainsail 下载
          if [ -f kiauh/components/webui_client/mainsail_data.py ]; then
            sed -i -E 's|BASE_DL_URL: str = ".*"|BASE_DL_URL: str = "https://gitee.com/ydd632184193/mainsail_zip/raw/master/"|g' kiauh/components/webui_client/mainsail_data.py
          fi
          if [ -f kiauh/components/webui_client/client_utils.py ]; then
            sed -i 's|/latest/download/|/|g' kiauh/components/webui_client/client_utils.py
          fi

          # 3. 使用 cat 写入补丁脚本（防止 YAML 破坏缩进）
          cat << 'PYEOF' > patch.py
import re
file_path = 'kiauh/core/menus/install_menu.py'
with open(file_path, 'r', encoding='utf-8') as f:
    content = f.read()

if '"9": Option' not in content:
    content = content.replace('"8": Option(method=self.install_crowsnest),', '"8": Option(method=self.install_crowsnest),\n            "9": Option(method=self.install_timelapse),')
    content = content.replace('║  3) [Mainsail]            │                           ║', '║  3) [Mainsail]            │  9) [Timelapse]           ║')

if 'def install_timelapse' not in content:
    method = (
        '    def install_timelapse(self, **kwargs) -> None:\n'
        '        import os\n'
        '        print("\\n[INFO] 正在从你的 Gitee 仓库安装 Moonraker-Timelapse...")\n'
        '        tl_dir = os.path.expanduser("~/moonraker-timelapse")\n'
        '        if not os.path.exists(tl_dir):\n'
        '            os.system("git clone https://gitee.com/ydd632184193/moonraker-timelapse.git ~/moonraker-timelapse")\n'
        '        print("[INFO] 正在执行官方安装脚本 (make install)...")\n'
        '        os.system("cd ~/moonraker-timelapse && make install")\n'
        '        print("[INFO] 正在检查依赖和配置文件...")\n'
        '        os.system("sudo apt install ffmpeg -y")\n'
        '        conf_path = os.path.expanduser("~/printer_data/config/moonraker.conf")\n'
        '        with open(conf_path, "r") as f:\n'
        '            if "[timelapse]" not in f.read():\n'
        '                with open(conf_path, "a") as f_append:\n'
        '                    f_append.write("\\n[timelapse]\\n")\n'
        '        os.system("sudo systemctl restart moonraker")\n'
        '        print("\\n[OK] Timelapse 安装并配置完美成功！按回车返回菜单...")\n'
        '        input()\n'
        '\n'
        '    def install_crowsnest(self, **kwargs) -> None:\n'
    )
    content = content.replace('    def install_crowsnest(self, **kwargs) -> None:\n', method)

with open(file_path, 'w', encoding='utf-8') as f:
    f.write(content)
print("✅ KIAUH 自动化注入完成！")
PYEOF
          
          python3 patch.py
          rm patch.py
          
          # 4. 清理缓存
          find . -type d -name "__pycache__" -exec rm -rf {} + || true
          
      - name: Commit and Push to Gitee
        run: |
          cd kiauh-patched
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto patch: Gitee mirrors, Mainsail URL fix, & Timelapse injection" || echo "Nothing to commit"
          git remote set-url origin https://ydd632184193:${{ secrets.GITEE_TOKEN }}@gitee.com/ydd632184193/kiauh.git
          git config --global http.version HTTP/1.1
          for i in 1 2 3; do git push -f origin HEAD:master && break || sleep 5; done
